<text x="80" y="338" font-family="Arial" font-size="24" font-weight="700" fill="#1d2a57">Why this project matters</text>
<text x="98" y="382" font-family="Arial" font-size="20" fill="#4a5771">• Measures France revenue and customer behavior from transaction data.</text>
<text x="98" y="422" font-family="Arial" font-size="20" fill="#4a5771">• Connects Excel formulas and filtering logic to real business KPIs.</text>
<text x="98" y="462" font-family="Arial" font-size="20" fill="#4a5771">• Includes customer-level, invoice-level and descriptive-statistics analysis.</text>
<text x="98" y="502" font-family="Arial" font-size="20" fill="#4a5771">• Best for showing Excel discipline, KPI thinking and analytic foundations.</text>
