<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f5f8ff"/>
<rect x="40" y="40" width="1120" height="540" rx="28" fill="#ffffff" stroke="#dfe7fb"/>
<text x="80" y="105" font-family="Arial" font-size="34" font-weight="700" fill="#1d2a57">Airline Customer Satisfaction Analysis</text>
<text x="80" y="142" font-family="Arial" font-size="18" fill="#566684">Customer-experience case study focused on service prioritization and segment-aware recommendations.</text>
<rect x="80" y="185" width="235" height="96" rx="18" fill="#f7faff" stroke="#dfe7fb"/><text x="104" y="222" font-family="Arial" font-size="18" fill="#667594">Passenger Records</text><text x="104" y="258" font-family="Arial" font-size="28" font-weight="700" fill="#215cff">103,904</text>
<rect x="335" y="185" width="235" height="96" rx="18" fill="#f7faff" stroke="#dfe7fb"/><text x="359" y="222" font-family="Arial" font-size="18" fill="#667594">Business Class Sample</text><text x="359" y="258" font-family="Arial" font-size="28" font-weight="700" fill="#215cff">7,111</text>
<rect x="590" y="185" width="235" height="96" rx="18" fill="#f7faff" stroke="#dfe7fb"/><text x="614" y="222" font-family="Arial" font-size="18" fill="#667594">Priority Area</text><text x="614" y="258" font-family="Arial" font-size="23" font-weight="700" fill="#215cff">Inflight Entertainment</text>
<rect x="845" y="185" width="275" height="96" rx="18" fill="#f7faff" stroke="#dfe7fb"/><text x="869" y="222" font-family="Arial" font-size="18" fill="#667594">Key Segment Context</text><text x="869" y="258" font-family="Arial" font-size="25" font-weight="700" fill="#215cff">Long-Haul Business</text>
<text x="80" y="338" font-family="Arial" font-size="24" font-weight="700" fill="#1d2a57">What the analysis demonstrates</text>
<text x="98" y="382" font-family="Arial" font-size="20" fill="#4a5771">• Uses satisfaction and importance together to prioritize CX investment.</text>
<text x="98" y="422" font-family="Arial" font-size="20" fill="#4a5771">• Connects long-haul Business Class behavior to premium-service priorities.</text>
<text x="98" y="462" font-family="Arial" font-size="20" fill="#4a5771">• Highlights Inflight Entertainment and Seat Comfort as improvement areas.</text>
<text x="98" y="502" font-family="Arial" font-size="20" fill="#4a5771">• Shows how cross-analysis produces stronger recommendations than one pivot alone.</text>
<rect x="760" y="340" width="320" height="160" rx="20" fill="#23325e"/>
<text x="790" y="385" font-family="Arial" font-size="24" font-weight="700" fill="#ffffff">CX decision flow</text>
<text x="790" y="425" font-family="Arial" font-size="19" fill="#dfe7ff">Segment + Behavior</text>
<text x="790" y="458" font-family="Arial" font-size="19" fill="#dfe7ff">+ Satisfaction + Importance</text>
<text x="790" y="491" font-family="Arial" font-size="19" fill="#dfe7ff">→ Prioritized Recommendation</text>
</svg>