<text x="80" y="338" font-family="Arial" font-size="24" font-weight="700" fill="#1d2a57">Why this is the featured project</text>
<text x="98" y="382" font-family="Arial" font-size="20" fill="#4a5771">• Combines RFM segmentation, reactivation, market basket and satisfaction analysis.</text>
<text x="98" y="422" font-family="Arial" font-size="20" fill="#4a5771">• Converts findings into a measurable 12-month CRM action plan.</text>
<text x="98" y="462" font-family="Arial" font-size="20" fill="#4a5771">• Links recommendations to retention, revenue, conversion and CX KPIs.</text>
<text x="98" y="502" font-family="Arial" font-size="20" fill="#4a5771">• Demonstrates the strongest end-to-end business story in the repository.</text>
